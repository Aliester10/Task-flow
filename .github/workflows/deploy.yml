name: Deploy TaskFlow ke Production Server

on:
  push:
    branches:
      - main # Hanya berjalan jika ada perubahan di branch main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted # Memerintah runner di VPS yang sudah disiapkan

    steps:
      - name: 📥 Tarik kode terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 🚀 Build & deploy langsung di server VPS
        run: |
          # 1. Salin semua file kode dari Runner ke folder rilis VPS
          rsync -a --exclude='.git' "${{ github.workspace }}/" /srv/docker/apps/taskflow/

          # 2. Pindah ke folder rilis VPS
          cd /srv/docker/apps/taskflow

          # 3. Hapus file override milik developer agar tidak mengganggu server
          rm -f docker-compose.override.yml

          # 4. Rakit ulang image secara lokal dan jalankan container
          echo "Merakit (build) dan menyalakan aplikasi TaskFlow..."
          docker compose -f docker-compose.yml up -d --build --remove-orphans || {
            echo "Compose up failed! Printing logs before exiting..."
            docker logs taskflow_backend || true
            docker inspect taskflow_backend --format='{{json .State.Health}}' || true
            exit 1
          }

          # 5. Beri jeda untuk healthcheck, lalu verifikasi container berjalan
          echo "Deployment berhasil! Menunggu healthcheck..."
          sleep 30
          docker ps | grep taskflow || true
          docker logs taskflow_backend || true
          docker inspect taskflow_backend --format='{{json .State.Health}}' || true
