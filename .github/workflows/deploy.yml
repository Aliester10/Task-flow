name: Deploy TaskFlow ke Production Server

on:
  push:
    branches:
      - main # Hanya berjalan jika ada perubahan di branch main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted # Memerintah runner di VPS yang sudah disiapkan

    steps:
      - name: 📥 Tarik kode terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 🚀 Eksekusi deploy di server VPS
        run: |
          # 1. Pindah ke direktori aplikasi di server
          cd /srv/docker/apps/taskflow

          # 2. Timpa docker-compose.yml terbaru dari GitHub ke folder server
          #    (kode/Dockerfile sudah ditarik Runner ke folder workspace-nya sendiri)
          cp "${{ github.workspace }}/docker-compose.yml" /srv/docker/apps/taskflow/

          # 3. Tarik image terbaru dari registry (GHCR) dan restart container
          echo "Menyalakan aplikasi TaskFlow..."
          docker compose pull
          docker compose up -d --remove-orphans

          # 4. Beri jeda untuk healthcheck, lalu verifikasi container berjalan
          echo "Deployment berhasil! Menunggu healthcheck..."
          sleep 10
          docker ps | grep taskflow
