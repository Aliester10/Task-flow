name: Deploy TaskFlow

# Alur sesuai standarisasi.md Bab 4:
# push ke main → build image → push ke ghcr.io → VPS pull & up (~60 detik)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/aliester/taskflow-backend
  IMAGE_FRONTEND: ghcr.io/aliester/taskflow-frontend

jobs:
  # ─── 1. Build & push image ke GitHub Container Registry ────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/aliester/taskflow-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/aliester/taskflow-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy di VPS via Self-Hosted Runner ───────────────────────────────
  # VPS yang "menarik" perintah dari GitHub (runner terdaftar di VPS), sehingga
  # TIDAK perlu membuka akses SSH maupun menaruh kunci server di GitHub Secrets.
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sinkronkan docker-compose.yml ke folder aplikasi
        # Runner berjalan di VPS — cukup salin compose terbaru dari repo hasil checkout
        run: cp docker-compose.yml /srv/docker/apps/taskflow/docker-compose.yml

      - name: Login GHCR (untuk tarik image privat)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull & restart container
        run: |
          cd /srv/docker/apps/taskflow
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
