# ═══════════════════════════════════════════════════════════════════════════
# DEV LOKAL — otomatis ter-merge saat `docker compose up` di mesin developer.
# TIDAK dipakai di VPS (CI/CD deploy memakai `-f docker-compose.yml` saja).
#
# Di produksi TaskFlow menumpang PostgreSQL utama server. Untuk dev, kita
# TIDAK ikut menumpang — override ini menyediakan Postgres lokal sendiri
# supaya database server tidak tersentuh saat ngoprek di lokal.
#
# Prasyarat sekali jalan (compose utama pakai 2 network eksternal):
#   docker network create web
#   docker network create taskflow_local_db      # samakan dengan DB_NETWORK di .env
# Di .env lokal, set: DB_HOST=db  dan  DB_NETWORK=taskflow_local_db
# ═══════════════════════════════════════════════════════════════════════════

services:
  # Postgres lokal khusus dev — backend mengaksesnya via network `internal`.
  db:
    image: postgres:15-alpine
    container_name: taskflow_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - taskflow_db_data:/var/lib/postgresql/data
    ports:
      # Akses DB dari host untuk psql / prisma studio saat dev
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  backend:
    # Dev: tunggu Postgres lokal siap sebelum start (jalankan migrate deploy)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Buka aplikasi di http://localhost:8080 saat dev
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  taskflow_db_data:
